<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="theme-color" content="#303790">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- ใช้ black-translucent เพื่อให้หน้าเว็บคลุมพื้นที่ 100% -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>ThaID Full Feature</title>

  <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
  <link rel="icon" type="image/png" sizes="192x192" href="logo.png">
  <link rel="icon" type="image/png" sizes="512x512" href="logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LINE+Seed+Sans+TH:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    // Detect an iOS Home Screen web app before layout so only that mode gets extra top clearance.
    (function markHomeScreenApp() {
      const standalone = window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches ||
        window.matchMedia('(display-mode: fullscreen)').matches;
      if (standalone) document.documentElement.classList.add('is-home-screen-app');
    })();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      margin: 0;
      background: #303790;
      overflow: hidden;
    }

    /* ===== Privacy Screen (เบลอใส ไม่มีสีทับ) ===== */
    #privacy-screen {
      position: fixed;
      /* ขยายขอบออกไป 20px เพื่อให้คลุม Safe Area */
      top: -20px; left: -20px; right: -20px; bottom: -20px;
      z-index: 2147483647;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: none;
      /* ใสเกือบ 100% แต่ให้ iOS ยอมเรนเดอร์ blur */
      background: rgba(255, 255, 255, 0.01);
    }

    /* backdrop-filter ใส่เฉพาะตอนแสดง เพื่อไม่ให้ layer เบลอค้างอยู่ตอนใช้งานปกติ */
    #privacy-screen.is-visible {
      opacity: 1;
      visibility: visible;
      -webkit-backdrop-filter: blur(32px);
      backdrop-filter: blur(32px);
    }

    body {
      font-family: 'LINE Seed Sans TH', 'Prompt', sans-serif;
      width: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app-container {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      height: auto;
      max-height: none;
      max-width: none;
      width: auto;
      border: none;
      border-radius: 0;
      background: #303790;
      display: flex;
      flex-direction: column;
      box-shadow: none;
      overflow: hidden;
    }

    input[type="file"] { display: none; }

    header {
      color: white;
      background: #303790;
      flex-shrink: 0;
      position: relative;
      z-index: 50;
      /* ดันเนื้อหาลงมาไม่ให้ทับรอยบาก */
      padding: max(calc(env(safe-area-inset-top) + 8px), 62px) 10px 8px 10px;
      isolation: isolate;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    /* Home Screen apps can draw under the translucent iOS status bar. Keep a larger top inset there. */
    html.is-home-screen-app header {
      padding-top: max(calc(env(safe-area-inset-top) + 12px), 82px);
    }

    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .user-info { display: flex; align-items: center; gap: 12px; }

    .avatar-container { position: relative; cursor: pointer; border-radius: 50%; }
    .avatar-container:active { transform: scale(0.95); }
    .avatar {
      width: 46px; height: 46px; border-radius: 50%; background-color: #ccc;
      background-size: cover; background-position: center; border: 2px solid rgba(255,255,255,0.3);
      background-image: url('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80');
    }

    .user-text p { font-size: 13px; color: #e2e8f0; font-weight: 400; margin-bottom: 2px; display: flex; align-items: center; gap: 6px;}
    .user-text h1 { font-size: 17px; font-weight: 600; margin-top: 0; letter-spacing: -0.2px;}

    .header-icons { display: flex; gap: 12px; font-size: 18px; }
    .header-icons i {
      width: 42px; height: 42px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    .header-icons i:active { background: rgba(0, 0, 0, 0.4); }

    .online-badge {
      background: #22c55e; color: white; font-size: 9px; font-weight: 600;
      padding: 2px 6px; border-radius: 4px; margin-left: 2px;
      display: inline-flex; align-items: center; gap: 4px; vertical-align: middle;
      letter-spacing: 0.5px;
    }
    .online-dot { width: 4px; height: 4px; background: white; border-radius: 50%; }

    .main-scroll-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .main-scroll-area::-webkit-scrollbar { display: none; }

    .blue-section {
      padding: 0 clamp(18px, 4vw, 24px) 10px;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .card-wrapper {
      width: 100%;
      max-width: none;
      height: auto;
      aspect-ratio: 1.58 / 1;
      perspective: 1000px;
      position: relative;
      margin-top: 0;
    }

    .card-inner {
      width: 100%; height: 100%;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d; position: relative; cursor: pointer;
    }
    .card-inner.is-flipped { transform: rotateY(180deg); }

    .card-front, .card-back {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3); overflow: hidden; background: #fff;
    }
    .card-back { transform: rotateY(180deg); }

    .card-image { width: 100%; height: 100%; object-fit: contain; background: #fff; display: block; }

    .lock-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.22);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      border-radius: 12px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 10;
    }
    .lock-icon-svg { width: 56px; height: 56px; fill: #333; margin-bottom: 12px; }
    .lock-text { font-size: 17px; font-weight: 600; color: #333; }

    .card-action-bar { margin-top: 10px; display: flex; justify-content: center; gap: 12px; width: 100%; }

    .card-action-btn {
      background: #3f48a5; color: white; border: none;
      padding: 8px 16px; border-radius: 20px;
      font-size: 14px; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: all 0.2s;
      font-family: inherit;
    }
    .card-action-btn:active { transform: scale(0.95); }
    .card-action-btn.icon-only {
      padding: 0; width: 38px; height: 38px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      font-size: 16px;
    }

    .white-section {
      flex: 1;
      background: #ffffff;
      border-radius: 24px 24px 0 0;
      margin-top: 8px;
      padding-top: 24px;
      position: relative;
      z-index: 20;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }

    .section-title { display: flex; justify-content: space-between; align-items: center; margin: 0 20px 16px 20px; }
    .section-title h2 { font-size: 17px; color: #333; font-weight: 700; }
    .section-title a { font-size: 13px; color: #888; text-decoration: none; font-weight: 500;}

    .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 20px; }
    .menu-item { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; cursor: pointer; }

    .menu-icon {
      width: 56px; height: 56px;
      background: #eceef2;
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
    }
    .menu-icon svg {
      width: 30px; height: 30px;
      stroke: #303790; stroke-width: 1.2; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .menu-item span { font-size: 13px; color: #4b5563; line-height: 1.3; font-weight: 500;}

    .carousel-wrapper {
      overflow-x: auto;
      scrollbar-width: none;
      margin-top: 20px;
      padding: 0;
      position: relative;
    }
    .carousel-wrapper::-webkit-scrollbar { display: none; }

    .carousel-track { display: flex; gap: 12px; width: max-content; padding: 0 10%; }

    .banner {
      flex: 0 0 auto; border-radius: 12px; overflow: hidden;
      position: relative; height: 70px; background: #e5e7eb; cursor: pointer;
    }

    .banner-bg-img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 1;
    }

    .banner-placeholder {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      color: #9ca3af; font-size: 24px; z-index: 0;
    }

    .carousel-dots { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; margin-bottom: 20px; }

    .dot-indicator { width: 8px; height: 8px; border-radius: 50%; background-color: #d1d5db; transition: all 0.3s ease; }
    .dot-indicator.active { width: 24px; border-radius: 4px; background-color: #303790; }

    .announcement-vertical-list { display: flex; flex-direction: column; gap: 12px; padding: 0 20px; margin-bottom: 20px; }

    .announcement-vertical-box {
      width: 100%; height: 80px; border-radius: 12px;
      background: #f1f5f9; overflow: hidden; position: relative;
      cursor: pointer; border: 1px solid #e2e8f0;
    }
    .announcement-vertical-box .banner-bg-img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 1;
    }
    .announcement-vertical-box .banner-placeholder {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      color: #9ca3af; font-size: 24px; z-index: 0;
    }

    .bottom-nav {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      width: auto;
      background: white;
      display: flex; justify-content: space-around; align-items: center;
      padding: 12px 0 max(20px, env(safe-area-inset-bottom)) 0;
      border-top: 1px solid #eee;
      z-index: 30;
    }

    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #9ca3af; font-size: 12px; background: none; border: none; cursor: pointer; font-family: inherit; font-weight: 500;}
    .nav-item.active { color: #303790; font-weight: 700;}
    .nav-item i { font-size: 22px; }

    .nav-scan { margin-top: -35px; }
    .scan-btn { width: 64px; height: 64px; background: #303790; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; border: 5px solid #f8f9fa; box-shadow: 0 4px 12px rgba(48, 55, 144, 0.3); }

    .scan-icon {
      width: 32px; height: 32px;
      stroke: #ffffff; stroke-width: 1.8; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
    }

    .chat-fab {
      position: absolute;
      right: 16px;
      bottom: calc(100% + 12px);
      top: auto;
      width: 50px;
      height: 50px;
      background: white;
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      cursor: pointer;
      z-index: 40;
    }
    .chat-fab svg {
      width: 28px; height: 28px;
      stroke: #303790; stroke-width: 2; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
    }

    .pin-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 100; display: flex; flex-direction: column; justify-content: flex-end;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .pin-modal.show { opacity: 1; pointer-events: all; }
    .pin-container {
      background: #f8f9fa; border-radius: 30px 30px 0 0; padding: 24px 20px 40px 20px;
      display: flex; flex-direction: column; align-items: center;
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      width: 100%;
    }
    .pin-modal.show .pin-container { transform: translateY(0); }
    .pin-title { font-size: 18px; font-weight: 700; color: #333; margin-bottom: 20px; }
    .pin-dots { display: flex; gap: 12px; margin-bottom: 30px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #e5e7eb; border: 1px solid #d1d5db; transition: background 0.2s; }
    .dot.filled { background: #6b7280; border-color: #6b7280; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 300px; }
    .key { width: 70px; height: 70px; border-radius: 50%; background: #eef1f5; color: #303790; font-size: 26px; font-weight: 500; display: flex; justify-content: center; align-items: center; cursor: pointer; user-select: none; margin: 0 auto; border: none; font-family: inherit; }
    .key:active { background: #d1d5db; }
    .key.action { background: transparent; font-size: 20px; color: #303790; }
    .forgot-btn { margin-top: 20px; font-size: 14px; color: #555; background: #e5e7eb; padding: 8px 20px; border-radius: 20px; border: none; cursor: pointer; font-family: inherit;}

    .expand-modal {
      position: fixed;
      inset: 0;
      width: auto;
      height: auto;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      flex-direction: column;
      overflow: hidden;
      container-type: size;
    }

    .expand-header {
      padding: calc(env(safe-area-inset-top) + 8px) 20px 20px 20px;
      display: flex; justify-content: space-between; align-items: center;
      color: #ffffff; position: absolute; top: 0; left: 0; width: 100%; z-index: 10;
    }

    .back-btn,
    .header-icons-expanded .icon-btn {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: none;
      color: #ffffff;
      width: 46px; height: 46px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      font-size: 20px; cursor: pointer;
      box-shadow: none;
      transition: background 0.2s;
    }
    .back-btn:active,
    .header-icons-expanded .icon-btn:active { background: rgba(255, 255, 255, 0.35); }

    .header-icons-expanded { display: flex; gap: 12px; }

    .expand-card-container {
      /* เลื่อนพื้นที่จัดบัตรลงจากจุดกึ่งกลางเพียง 12px และยังคำนวณขนาดจากจอเดิม */
      position: absolute;
      top: 12px;
      right: 0;
      bottom: -12px;
      left: 0;
      display: flex; justify-content: center; align-items: center;
      container-type: size;
    }

    .expand-card-inner {
      flex-shrink: 0;
      /* ความสูงหลังหมุนไม่เกินจอ และเว้นระยะจากปุ่มด้านบนโดยให้ขอบบนล่างสมดุล */
      width: min(
        calc(98cqh),
        calc((98cqw) * 1.58),
        calc(100cqh - env(safe-area-inset-top) - env(safe-area-inset-top) - 148px)
      );
      aspect-ratio: 1.58 / 1;
      position: relative;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      transform: rotate(90deg);
      transform-style: preserve-3d;
      cursor: pointer; perspective: 1000px;
    }
    .expand-card-inner.is-flipped { transform: rotate(90deg) rotateY(180deg); }

    .expand-card-front, .expand-card-back {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      overflow: hidden;
      background: transparent;
    }
    .expand-card-back { transform: rotateY(180deg); }

    .expand-card-image { width: 100%; height: 100%; object-fit: cover; display: block; }

    .reset-btn {
      position: absolute; bottom: 15px; right: 15px;
      width: 24px; height: 24px;
      background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%; cursor: pointer; z-index: 999; opacity: 0.6;
      transition: all 0.2s; display: flex; justify-content: center; align-items: center;
      color: white; font-size: 10px;
    }
    .reset-btn:hover, .reset-btn:active { opacity: 1; background: rgba(255, 0, 0, 0.8); border-color: red; }

    .solid-box-icon { stroke: none !important; }
  </style>
</head>
<body>
  <div id="privacy-screen" aria-hidden="true"></div>

  <input type="file" id="uploadBanner1" accept="image/*" onchange="handleImageUpload(event, 'banner1')">
  <input type="file" id="uploadBanner2" accept="image/*" onchange="handleImageUpload(event, 'banner2')">

  <input type="file" id="uploadAnn1" accept="image/*" onchange="handleImageUpload(event, 'ann1')">
  <input type="file" id="uploadAnn2" accept="image/*" onchange="handleImageUpload(event, 'ann2')">
  <input type="file" id="uploadAnn3" accept="image/*" onchange="handleImageUpload(event, 'ann3')">
  <input type="file" id="uploadAnn4" accept="image/*" onchange="handleImageUpload(event, 'ann4')">
  <input type="file" id="uploadAnn5" accept="image/*" onchange="handleImageUpload(event, 'ann5')">

  <input type="file" id="uploadAvatar" accept="image/*" onchange="handleImageUpload(event, 'avatar')">
  <input type="file" id="uploadIdFront" accept="image/*" onchange="handleImageUpload(event, 'front')">
  <input type="file" id="uploadIdBack" accept="image/*" onchange="handleImageUpload(event, 'back')">

  <div class="app-container">

    <button class="reset-btn" onclick="resetImages()" title="ล้างรูปภาพทั้งหมด"><i class="fa-solid fa-trash-can"></i></button>

    <header>
      <div class="header-top">
        <div class="user-info">
          <div class="avatar-container" onclick="document.getElementById('uploadAvatar').click()">
            <div class="avatar" id="avatarImg"></div>
          </div>
          <div class="user-text">
            <p>สวัสดี <span class="online-badge"><span class="online-dot"></span>ONLINE</span></p>
            <h1>คุณ ธนันท์รัฐ​ บัวสด</h1>
          </div>
        </div>

        <div class="header-icons">
          <i class="fa-regular fa-bell"></i>
          <i class="fa-solid fa-power-off"></i>
        </div>
      </div>
    </header>

    <div class="main-scroll-area">
      <div class="blue-section">
        <div class="card-wrapper" id="cardWrapper">
          <div class="card-inner" id="myIdCard" onclick="handleCardClick(event)">

            <div class="card-front">
              <img src="" alt="Front ID" class="card-image" id="idFrontImg" style="background: #e2e8f0; display: none;">

              <div id="frontUploadPrompt" style="position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; background: #f1f5f9; color:#64748b;">
                <i class="fa-solid fa-image" style="font-size: 30px; margin-bottom: 10px;"></i>
                <p style="font-size: 14px;">คลิกเพื่ออัปโหลดรูปบัตรด้านหน้า</p>
              </div>

              <div class="lock-overlay" id="lockScreen" onclick="showPinModal(event)">
                <svg class="lock-icon-svg" viewBox="0 0 24 24">
                  <path d="M17 8V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h-1zM9 6a3 3 0 0 1 6 0v2H9V6zm3 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" />
                </svg>
                <p class="lock-text">คลิกเพื่อแสดงบัตร</p>
              </div>
            </div>

            <div class="card-back">
              <img src="" alt="Back ID" class="card-image" id="idBackImg" style="background: #e2e8f0; display: none;">

              <div id="backUploadPrompt" style="position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; background: #f1f5f9; color:#64748b;">
                <i class="fa-solid fa-image" style="font-size: 30px; margin-bottom: 10px;"></i>
                <p style="font-size: 14px;">คลิกเพื่ออัปโหลดรูปบัตรด้านหลัง</p>
              </div>
            </div>

          </div>
        </div>

        <div class="card-action-bar" id="cardMenu">
          <button class="card-action-btn icon-only" id="btnInfo" onclick="handleActionClick('info', event)">
            <i class="fa-regular fa-id-badge"></i>
          </button>
          <button class="card-action-btn" id="btnExpand" onclick="handleActionClick('expand', event)">
            <i class="fa-solid fa-up-right-and-down-left-from-center"></i> ขยายรูปบัตร
          </button>
          <button class="card-action-btn icon-only" id="btnFlip" onclick="handleActionClick('flip', event)">
            <i class="fa-solid fa-arrows-rotate"></i>
          </button>
        </div>
      </div>

      <div class="white-section">

  <script>
    (function setupAppSwitcherPrivacy() {
      const screen = document.getElementById('privacy-screen');
      const app = document.querySelector('.app-container');
      const expandedCardModal = document.getElementById('expandModal');
      const root = document.documentElement;
      if (!screen) return;
      let edgeSwipeStartY = null;

      const showPrivacyScreen = () => {
        root.classList.add('is-privacy-active');
        if (app) app.classList.add('is-privacy-blurred');
        if (expandedCardModal) expandedCardModal.classList.add('is-privacy-blurred');
        screen.classList.add('is-visible');
      };
      const hidePrivacyScreen = () => {
        screen.classList.remove('is-visible');
        root.classList.remove('is-privacy-active');
        if (app) app.classList.remove('is-privacy-blurred');
        if (expandedCardModal) expandedCardModal.classList.remove('is-privacy-blurred');
      };

      // เปิดหน้าให้คมชัดก่อน แล้วค่อยเปิดเบลอเมื่อเริ่มสลับแอป
      hidePrivacyScreen();

      document.addEventListener('touchstart', (event) => {
        const touch = event.touches && event.touches[0];
        if (!touch) return;
        edgeSwipeStartY = touch.clientY >= window.innerHeight - 36 ? touch.clientY : null;
        if (edgeSwipeStartY === null && document.visibilityState === 'visible') {
          hidePrivacyScreen();
        }
      }, { passive: true });

      document.addEventListener('touchmove', (event) => {
        const touch = event.touches && event.touches[0];
        if (edgeSwipeStartY === null || !touch) return;
        if (edgeSwipeStartY - touch.clientY > 20) {
          showPrivacyScreen();
        }
      }, { passive: true });

      document.addEventListener('touchend', () => {
        edgeSwipeStartY = null;
      }, { passive: true });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') showPrivacyScreen();
        else hidePrivacyScreen();
      });
      document.addEventListener('webkitvisibilitychange', () => {
        // ใช้สถานะมาตรฐานก่อน เพื่อไม่ให้ค่า webkitHidden ที่ค้างอยู่ทำให้เบลอกลับมา
        if (document.visibilityState === 'hidden') showPrivacyScreen();
        else if (document.visibilityState === 'visible') hidePrivacyScreen();
        else if (document.webkitHidden === true) showPrivacyScreen();
        else hidePrivacyScreen();
      });

      window.addEventListener('pagehide', showPrivacyScreen);
      window.addEventListener('pageshow', hidePrivacyScreen);
      // (ลบ listener 'blur' ออกแล้ว เพราะ iOS ยิง blur ตอนเปิดแอป/แตะแถบระบบ ทำให้เบลอค้าง)
      // ล้างทันทีเมื่อได้ focus/resume กลับมา ไม่รอ visibilityState ที่ iOS อาจอัปเดตช้า
      window.addEventListener('focus', hidePrivacyScreen);
      window.addEventListener('resume', hidePrivacyScreen);
      document.addEventListener('resume', hidePrivacyScreen);

      // ตรวจตอนเริ่มเปิดแอปด้วย เผื่อเหตุการณ์เริ่มต้นเกิดก่อนติดตั้ง listeners
      const clearOnInitialForeground = () => {
        if (document.visibilityState === 'visible') hidePrivacyScreen();
      };
      if (document.readyState === 'complete') clearOnInitialForeground();
      else window.addEventListener('load', clearOnInitialForeground, { once: true });
    })();

    let autoSlideInterval;
    let userTouching = false;
    let isJumping = false;
    let currentIndex = 0;
    const REAL = 2;

    const carouselWrapper = document.getElementById('bannerCarousel');
    const carouselTrack = document.getElementById('carouselTrack');
    const dots = [document.getElementById('dot1'), document.getElementById('dot2')];

    function slideEls() {
      return Array.from(carouselTrack.querySelectorAll('.banner'));
    }

    function setupLoop() {
      const real = Array.from(carouselTrack.querySelectorAll('.banner'));
      const first = real[0], last = real[real.length - 1];

      const cloneLast = last.cloneNode(true);
      cloneLast.id = 'bannerCloneBefore';
      cloneLast.querySelector('.banner-bg-img').id = 'bannerImgCloneBefore';
      cloneLast.querySelector('.banner-placeholder').id = 'bannerBgCloneBefore';
      cloneLast.removeAttribute('onclick');

      const cloneFirst = first.cloneNode(true);
      cloneFirst.id = 'bannerCloneAfter';
      cloneFirst.querySelector('.banner-bg-img').id = 'bannerImgCloneAfter';
      cloneFirst.querySelector('.banner-placeholder').id = 'bannerBgCloneAfter';
      cloneFirst.removeAttribute('onclick');

      carouselTrack.insertBefore(cloneLast, first);
      carouselTrack.appendChild(cloneFirst);
    }

    function slideCenter(el) {
      return el.offsetLeft + el.offsetWidth / 2 - carouselWrapper.clientWidth / 2;
    }

    function jumpTo(elIndex) {
      isJumping = true;
      carouselWrapper.style.scrollBehavior = 'auto';
      carouselWrapper.style.scrollSnapType = 'none';
      carouselWrapper.scrollLeft = slideCenter(slideEls()[elIndex]);
      requestAnimationFrame(() => {
        carouselWrapper.style.scrollSnapType = '';
        carouselWrapper.style.scrollBehavior = '';
        isJumping = false;
      });
    }

    function smoothTo(elIndex) {
      carouselWrapper.scrollTo({ left: slideCenter(slideEls()[elIndex]), behavior: 'smooth' });
    }

    function nearestElIndex() {
      const els = slideEls();
      const center = carouselWrapper.scrollLeft + carouselWrapper.clientWidth / 2;
      let best = 0, min = Infinity;
      els.forEach((s, i) => {
        const d = Math.abs(s.offsetLeft + s.offsetWidth / 2 - center);
        if (d < min) { min = d; best = i; }
      });
      return best;
    }

    function fixIfOnClone() {
      const i = nearestElIndex();
      if (i === 0) jumpTo(REAL);
      else if (i === REAL + 1) jumpTo(1);
    }

    function updateCarouselDots(index) {
      dots.forEach((d, i) => d.classList.toggle('active', i === index));
    }

    function startAutoSlide() {
      clearInterval(autoSlideInterval);
      autoSlideInterval = setInterval(() => {
        if (userTouching || isJumping) return;
        smoothTo(nearestElIndex() + 1);
      }, 3500);
    }
    function stopAutoSlide() { clearInterval(autoSlideInterval); }

    carouselWrapper.addEventListener('touchstart', () => { userTouching = true; stopAutoSlide(); }, { passive: true });
    carouselWrapper.addEventListener('touchend', () => { userTouching = false; setTimeout(startAutoSlide, 2500); }, { passive: true });

    let scrollTimer;
    carouselWrapper.addEventListener('scroll', () => {
      if (isJumping) return;
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        fixIfOnClone();
        const i = nearestElIndex();
        currentIndex = (i - 1 + REAL) % REAL;
        updateCarouselDots(currentIndex);
      }, 80);
    }, { passive: true });

    function updateBannerWidths() {
      const targetWidth = carouselWrapper.clientWidth * 0.80;
      carouselTrack.querySelectorAll('.banner').forEach(banner => {
        banner.style.width = targetWidth + 'px';
      });
    }

    function syncClones() {
      const pairs = [
        ['bannerImg2', 'bannerBg2', 'bannerImgCloneBefore', 'bannerBgCloneBefore'],
        ['bannerImg1', 'bannerBg1', 'bannerImgCloneAfter',  'bannerBgCloneAfter']
      ];
      pairs.forEach(([srcImg, srcBg, cImg, cBg]) => {
        const a = document.getElementById(srcImg), b = document.getElementById(srcBg);
        const ci = document.getElementById(cImg), cb = document.getElementById(cBg);
        if (!a || !ci) return;
        ci.src = a.src;
        ci.style.display = a.style.display;
        cb.style.display = b.style.display;
      });
    }

    let pinCode = "";
    const correctPin = "12345678";
    let isFlipped = false;
    let isUnlocked = false;
    let hasFrontImage = false;
    let hasBackImage = false;

    window.onload = function() {
      updateBannerWidths();
      setupLoop();
      updateBannerWidths();
      loadImagesFromStorage();
      setTimeout(() => { jumpTo(1); startAutoSlide(); }, 200);

      window.addEventListener('resize', () => {
        updateBannerWidths();
        jumpTo(currentIndex + 1);
      });
    };

    function handleActionClick(action, event) {
      event.stopPropagation();
      if (!isUnlocked) {
        alert('กรุณาคลิกที่บัตรเพื่อใส่รหัสผ่านก่อนใช้งาน');
        showPinModal(event);
        return;
      }
      if (action === 'info') alert('ดูข้อมูลบัตร');
      else if (action === 'expand') expandCard();
      else if (action === 'flip') flipCard();
    }

    function setSlotImage(type, url) {
      const prefix = type.startsWith('banner') ? 'banner' : 'ann';
      const n = type.slice(-1);
      const img = document.getElementById(prefix + 'Img' + n);
      const bg = document.getElementById(prefix + 'Bg' + n);
      if (!img || !bg) return;
      img.src = url;
      img.style.display = 'block';
      bg.style.display = 'none';
    }

    const SLOT_TYPES = ['banner1', 'banner2', 'ann1', 'ann2', 'ann3', 'ann4', 'ann5'];

    function loadImagesFromStorage() {
      const savedAvatar = localStorage.getItem('thaid_avatar');
      const savedFront = localStorage.getItem('thaid_front');
      const savedBack = localStorage.getItem('thaid_back');

      if (savedAvatar) document.getElementById('avatarImg').style.backgroundImage = `url('${savedAvatar}')`;

      if (savedFront) {
        const img = document.getElementById('idFrontImg');
        img.src = savedFront;
        img.style.display = 'block';
        document.getElementById('frontUploadPrompt').style.display = 'none';
        hasFrontImage = true;
      }

      if (savedBack) {
        const img = document.getElementById('idBackImg');
        img.src = savedBack;
        img.style.display = 'block';
        document.getElementById('backUploadPrompt').style.display = 'none';
        hasBackImage = true;
      }

      SLOT_TYPES.forEach(type => {
        const saved = localStorage.getItem('thaid_' + type);
        if (saved) setSlotImage(type, saved);
      });

      syncClones();
    }

    function handleCardClick(event) {
      if (!isUnlocked) return;
      event.stopPropagation();

      if (!isFlipped && !hasFrontImage) {
        document.getElementById('uploadIdFront').click();
      } else if (isFlipped && !hasBackImage) {
        document.getElementById('uploadIdBack').click();
      } else {
        flipCard();
      }
    }

    function showPinModal(event) {
      if (event) event.stopPropagation();
      document.getElementById('pinModal').classList.add('show');
      pinCode = "";
      updatePinDots();
    }

    function closePinModal() {
      document.getElementById('pinModal').classList.remove('show');
    }

    function inputPin(num) {
      if (pinCode.length < 8) {
        pinCode += num;
        updatePinDots();
        if (pinCode.length === 8) {
          setTimeout(() => {
            if (pinCode === correctPin) {
              unlockCard();
            } else {
              alert("❌ รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่");
              pinCode = "";
              updatePinDots();
            }
          }, 300);
        }
      }
    }

    function deletePin() {
      pinCode = pinCode.slice(0, -1);
      updatePinDots();
    }

    function updatePinDots() {
      document.querySelectorAll('#pinDots .dot').forEach((dot, index) => {
        dot.classList.toggle('filled', index < pinCode.length);
      });
    }

    function unlockCard() {
      closePinModal();
      isUnlocked = true;
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('myIdCard').classList.remove('is-flipped');
      isFlipped = false;
    }

    function flipCard() {
      if (!isUnlocked) return;
      const card = document.getElementById('myIdCard');
      isFlipped = !isFlipped;
      card.classList.toggle('is-flipped', isFlipped);
    }

    function expandCard() {
      if (!isUnlocked) return;
      if (!hasFrontImage && !hasBackImage) {
        alert("กรุณาอัปโหลดรูปบัตรก่อนขยายครับ");
        return;
      }
      const frontSrc = document.getElementById('idFrontImg').src;
      const backSrc = document.getElementById('idBackImg').src;
      document.getElementById('expandedFrontImg').src = frontSrc || backSrc;
      document.getElementById('expandedBackImg').src = backSrc || frontSrc;
      document.getElementById('expandModal').style.display = 'flex';
      document.getElementById('expandedCard').classList.remove('is-flipped');
    }

    function closeExpandCard() {
      document.getElementById('expandModal').style.display = 'none';
    }

    function flipExpandedCard() {
      document.getElementById('expandedCard').classList.toggle('is-flipped');
    }

    function handleImageUpload(event, type) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imageUrl = e.target.result;

          if (type === 'avatar') {
            document.getElementById('avatarImg').style.backgroundImage = `url('${imageUrl}')`;
          } else if (type === 'front') {
            const img = document.getElementById('idFrontImg');
            img.src = imageUrl;
            img.style.display = 'block';
            document.getElementById('frontUploadPrompt').style.display = 'none';
            hasFrontImage = true;
          } else if (type === 'back') {
            const img = document.getElementById('idBackImg');
            img.src = imageUrl;
            img.style.display = 'block';
            document.getElementById('backUploadPrompt').style.display = 'none';
            hasBackImage = true;
          } else if (SLOT_TYPES.includes(type)) {
            setSlotImage(type, imageUrl);
          }

          try { localStorage.setItem('thaid_' + type, imageUrl); } catch (err) { console.warn(err); }
          syncClones();
        };
        reader.readAsDataURL(file);
      }
      event.target.value = '';
    }

    function resetImages() {
      if (confirm('คุณต้องการล้างรูปภาพทั้งหมดและเริ่มต้นใหม่หรือไม่?')) {
        ['avatar', 'front', 'back', ...SLOT_TYPES].forEach(k => localStorage.removeItem('thaid_' + k));
        location.reload();
      }
    }
